    get: { tags: [StoreSettings], operationId: getStoreProfile, responses: { "200": { description: Shared store and receipt profile, content: { application/json: { schema: { type: object } } } }, "401": { $ref: "#/components/responses/ApiError" } } }
  /api/v1/store_profile/logo:
    get: { tags: [StoreSettings], operationId: getStoreProfileLogo, responses: { "200": { description: Store logo image, content: { image/png: { schema: { type: string, format: binary } }, image/jpeg: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }, "404": { description: Store logo is not configured } } }
  /api/v1/admin/cashier_shifts:
    get: { tags: [Shifts], operationId: listCashierShifts, parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }, { $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/Sort" }, { $ref: "#/components/parameters/Direction" }], responses: { "200": { description: Shift history, content: { application/json: { schema: { $ref: "#/components/schemas/CashierShiftListResponse" } } } }, "403": { $ref: "#/components/responses/ApiError" } } }
    post: { tags: [Shifts], operationId: openCashierShift, parameters: [{ $ref: "#/components/parameters/CsrfToken" }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [opening_cash], properties: { opening_cash: { type: integer, minimum: 0 }, opening_note: { type: string } } } } } }, responses: { "201": { description: Shift opened, content: { application/json: { schema: { $ref: "#/components/schemas/CashierShiftResponse" } } } }, "422": { $ref: "#/components/responses/ApiError" } } }
  /api/v1/admin/cashier_shifts/current:
    get: { tags: [Shifts], operationId: getCurrentCashierShift, responses: { "200": { description: Current shift, content: { application/json: { schema: { $ref: "#/components/schemas/CashierShiftResponse" } } } }, "403": { $ref: "#/components/responses/ApiError" } } }
  /api/v1/admin/cashier_shifts/{id}/close:
    patch: { tags: [Shifts], operationId: closeCashierShift, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CsrfToken" }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [actual_cash], properties: { actual_cash: { type: integer, minimum: 0 }, closing_note: { type: string } } } } } }, responses: { "200": { description: Shift closed, content: { application/json: { schema: { $ref: "#/components/schemas/CashierShiftResponse" } } } }, "403": { $ref: "#/components/responses/ApiError" }, "422": { $ref: "#/components/responses/ApiError" } } }
  /api/v1/admin/audit_logs:
    get: { tags: [Admin], operationId: listAuditLogs, parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/PerPage" }, { $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/Sort" }, { $ref: "#/components/parameters/Direction" }, { $ref: "#/components/parameters/IncludeTotal" }], responses: { "200": { description: Cursor-paginated audit logs, content: { application/json: { schema: { $ref: "#/components/schemas/AuditLogListResponse" } } } }, "400": { $ref: "#/components/responses/ApiError" }, "403": { $ref: "#/components/responses/ApiError" } } }
  /api/v1/admin/approvals:
    get:
      tags: [Admin]
      operationId: listSecurityApprovals
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }, { $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/Sort" }, { $ref: "#/components/parameters/Direction" }]
      responses: { "200": { description: Pending four-eyes approvals, content: { application/json: { schema: { type: object, required: [approvals, pagination], properties: { approvals: { type: array, items: { $ref: "#/components/schemas/AdminApproval" } }, pagination: { $ref: "#/components/schemas/Pagination" } } } } } }, "403": { $ref: "#/components/responses/ApiError" } }
  /api/v1/admin/approvals/{id}:
    patch:
      tags: [Admin]
      operationId: approveSecurityChange
      parameters: [{ $ref: "#/components/parameters/Uuid" }, { $ref: "#/components/parameters/CsrfToken" }, { $ref: "#/components/parameters/StepUpToken" }]
      responses: { "200": { description: Approval granted by a second administrator, content: { application/json: { schema: { type: object, required: [approval], properties: { approval: { $ref: "#/components/schemas/AdminApproval" } } } } } }, "403": { $ref: "#/components/responses/ApiError" }, "404": { $ref: "#/components/responses/ApiError" } }
  /api/v1/admin/jobs:
    get:
      tags: [Admin]
      operationId: listFailedJobs
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/PerPage" }, { $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/Sort" }, { $ref: "#/components/parameters/Direction" }, { $ref: "#/components/parameters/IncludeTotal" }]
      responses: { "200": { description: Queue metrics and cursor-paginated failed jobs, content: { application/json: { schema: { $ref: "#/components/schemas/JobListResponse" } } } }, "400": { $ref: "#/components/responses/ApiError" }, "403": { $ref: "#/components/responses/ApiError" } }
  /api/v1/admin/jobs/{id}:
    delete: { tags: [Admin], operationId: discardFailedJob, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CsrfToken" }], responses: { "204": { description: Job discarded }, "403": { $ref: "#/components/responses/ApiError" }, "404": { $ref: "#/components/responses/ApiError" } } }
  /api/v1/admin/jobs/{id}/retry:
    post: { tags: [Admin], operationId: retryFailedJob, parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CsrfToken" }], responses: { "200": { description: Job queued for retry, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: integer } } } } } }, "403": { $ref: "#/components/responses/ApiError" }, "404": { $ref: "#/components/responses/ApiError" } } }
  /api/v1/admin/api_docs:
    get:
      tags: [Admin]
      operationId: getOpenapiDocument
      responses: { "200": { description: OpenAPI YAML document, content: { application/yaml: { schema: { type: string } } } }, "403": { $ref: "#/components/responses/ApiError" } }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: Signed HTTP-only SameSite=Lax cookie created after successful OTP verification.
  parameters:
    CsrfToken: { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
    ReadinessToken: { in: header, name: X-Readiness-Token, required: true, schema: { type: string, minLength: 32 }, description: Internal production probe secret; never expose it to browser code. }
    StepUpToken: { in: header, name: X-Step-Up-Token, required: true, schema: { type: string }, description: Short-lived purpose-bound token returned by step-up verification. }
    Id: { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    Uuid: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    Page: { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
    Cursor: { in: query, name: cursor, schema: { type: string }, description: Opaque signed keyset cursor returned by the previous response. It is bound to search and sorting options. }
    IncludeTotal: { in: query, name: include_total, schema: { type: boolean, default: false }, description: Requests an exact count cached briefly; omit for the lowest database cost. }
    PerPage: { in: query, name: per_page, schema: { type: integer, minimum: 5, maximum: 50, default: 10 } }
    Search: { in: query, name: search, schema: { type: string, maxLength: 100 } }
    Sort: { in: query, name: sort, schema: { type: string }, description: Endpoint-specific whitelisted column. }
    Direction: { in: query, name: direction, schema: { type: string, enum: [asc, desc] } }
  responses:
    ApiError:
      description: Standard API error
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, pattern: "^[A-Z][A-Z0-9_]*$" }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 5, maximum: 50 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 1 }
    CursorPagination:
      type: object
      required: [per_page, next_cursor, previous_cursor, has_next, has_previous, total]
      properties:
        per_page: { type: integer, minimum: 5, maximum: 50 }
        next_cursor: { type: [string, "null"] }
        previous_cursor: { type: [string, "null"] }
        has_next: { type: boolean }
        has_previous: { type: boolean }
        total: { type: [integer, "null"], minimum: 0, description: Exact count only when include_total=true. }
    Message: { type: object, required: [message], properties: { message: { type: string } } }
    Readiness:
      type: object
      required: [status]
      properties:
        status: { const: ready }
    LoginRequest:
      type: object
      required: [email_address, password]
      properties: { email_address: { type: string, format: email }, password: { type: string, format: password }, captcha_token: { type: string, maxLength: 2048, description: Required only when a previous risk response returns CAPTCHA_REQUIRED. } }
    RegistrationRequest:
      allOf:
        - { $ref: "#/components/schemas/LoginRequest" }
        - { type: object, required: [password_confirmation], properties: { password_confirmation: { type: string, format: password, minLength: 12 } } }
    OtpVerificationRequest:
      type: object
      required: [challenge_token, code]
      properties: { challenge_token: { type: string }, code: { type: string, pattern: "^([0-9]{6}|[a-f0-9]{10})$" } }
    OtpChallenge:
      type: object
      required: [otp_required, account_unverified, challenge_token, email_hint, expires_in, resend_in]
      properties:
        otp_required: { const: true }
        account_unverified: { type: boolean }
        challenge_token: { type: string }
        email_hint: { type: string }
        expires_in: { type: integer }
        resend_in: { type: integer }
    PasswordResetRequest:
      type: object
      required: [token, password, password_confirmation]
      properties: { token: { type: string }, password: { type: string, format: password, minLength: 12 }, password_confirmation: { type: string, format: password, minLength: 12 } }
    PasswordChangeRequest:
      type: object
      required: [password, password_confirmation]
      properties: { password: { type: string, format: password, minLength: 12 }, password_confirmation: { type: string, format: password, minLength: 12 } }
    SecurityChallenge:
      type: object
      required: [challenge_token, email_hint, expires_in]
      properties: { challenge_token: { type: string }, email_hint: { type: string }, expires_in: { type: integer, minimum: 1 } }
    SecurityChallengeVerification:
      type: object
      required: [challenge_token, code]
      properties: { challenge_token: { type: string }, code: { type: string, pattern: "^[0-9]{6}$" } }
    PasskeyCeremonyRequest:
      type: object
      required: [challenge_token, credential]
      properties: { challenge_token: { type: string }, credential: { type: object, additionalProperties: true } }
    PasskeyOptionsResponse:
      type: object
      required: [options, challenge_token]
      properties: { options: { type: object, additionalProperties: true }, challenge_token: { type: string } }
    Passkey:
      type: object
      required: [id, nickname, created_at]
      properties: { id: { type: integer }, nickname: { type: string }, transports: { type: array, items: { type: string, enum: [usb, nfc, ble, internal, hybrid] } }, authenticator_attachment: { type: [string, "null"], enum: [platform, cross-platform, null] }, last_used_at: { type: [string, "null"], format: date-time }, created_at: { type: string, format: date-time } }
    SecurityEvent:
      type: object
      required: [id, action, created_at]
      properties: { id: { type: integer }, action: { type: string }, ip_address: { type: [string, "null"] }, user_agent: { type: [string, "null"] }, created_at: { type: string, format: date-time } }
    AccountSecurityResponse:
      type: object
      required: [events, passkeys, passkeys_enabled, totp_enabled, recovery_code_count, pagination]
      properties: { events: { type: array, items: { $ref: "#/components/schemas/SecurityEvent" } }, passkeys: { type: array, items: { $ref: "#/components/schemas/Passkey" } }, passkeys_enabled: { type: boolean }, totp_enabled: { type: boolean }, recovery_code_count: { type: integer, minimum: 0 }, pagination: { $ref: "#/components/schemas/CursorPagination" } }
    AuthenticatedUser:
      type: object
      required: [id, email_address, role, permissions]
      properties: { id: { type: integer }, email_address: { type: string, format: email }, first_name: { type: [string, "null"] }, last_name: { type: [string, "null"] }, role: { type: string }, permissions: { type: array, items: { type: string } }, avatar_url: { type: [string, "null"] } }
    Profile:
      type: object
      required: [id, email_address, role, active, created_at]
      properties: { id: { type: integer }, email_address: { type: string, format: email }, first_name: { type: [string, "null"], maxLength: 80 }, last_name: { type: [string, "null"], maxLength: 80 }, phone: { type: [string, "null"], maxLength: 30 }, role: { type: string }, active: { type: boolean }, email_verified_at: { type: [string, "null"], format: date-time }, avatar_url: { type: [string, "null"] }, created_at: { type: string, format: date-time } }
    ProfileUpdateRequest:
      type: object
      minProperties: 1
      properties: { first_name: { type: [string, "null"], maxLength: 80 }, last_name: { type: [string, "null"], maxLength: 80 }, phone: { type: [string, "null"], maxLength: 30, pattern: "^[+0-9() .-]*$" } }
    ProfileMutationResponse:
      type: object
      required: [profile, unchanged]
      properties: { profile: { $ref: "#/components/schemas/Profile" }, unchanged: { type: boolean } }
    AvatarMutationResponse:
      type: object
      required: [avatar_url, byte_size, content_type]
      properties: { avatar_url: { type: string }, byte_size: { type: integer, maximum: 51200 }, content_type: { const: image/avif } }
    User:
      type: object
      required: [id, email_address, role, active, created_at]
      properties: { id: { type: integer }, email_address: { type: string, format: email }, role: { type: string }, active: { type: boolean }, email_verified_at: { type: [string, "null"], format: date-time }, created_at: { type: string, format: date-time } }
    RoleOption: { type: object, required: [key, name], properties: { key: { type: string }, name: { type: string } } }
    Permission: { type: object, required: [key, name], properties: { key: { type: string }, name: { type: string }, description: { type: [string, "null"] } } }
    RoleWriteRequest:
      type: object
      properties: { key: { type: string, pattern: "^[a-z0-9_]+$" }, name: { type: string }, description: { type: string }, permission_keys: { type: array, uniqueItems: true, items: { type: string } } }
    SessionDevice:
      type: object
      required: [id, current, created_at, last_seen_at, expires_at]
      properties: { id: { type: integer }, ip_address: { type: [string, "null"] }, user_agent: { type: [string, "null"] }, current: { type: boolean }, created_at: { type: string, format: date-time }, last_seen_at: { type: string, format: date-time }, expires_at: { type: string, format: date-time } }
    DashboardResponse:
      type: object
      required: [user, metrics]
      properties:
        user: { $ref: "#/components/schemas/AuthenticatedUser" }
        metrics: { type: object, required: [users, active_sessions], properties: { users: { type: integer, minimum: 0 }, active_sessions: { type: integer, minimum: 0 } } }
    UserDetailResponse:
      type: object
      required: [user, roles]
      properties: { user: { $ref: "#/components/schemas/User" }, roles: { type: array, items: { $ref: "#/components/schemas/RoleOption" } } }
    UserMutationResponse:
      type: object
      required: [user]
      properties: { user: { $ref: "#/components/schemas/User" }, unchanged: { type: boolean } }
    Role:
      type: object
      required: [id, key, name, system, users_count, permission_keys, created_at]
      properties: { id: { type: integer }, key: { type: string }, name: { type: string }, description: { type: [string, "null"] }, system: { type: boolean }, users_count: { type: integer, minimum: 0 }, permission_keys: { type: array, items: { type: string } }, created_at: { type: string, format: date-time } }
    RoleResponse:
      type: object
      required: [role]
      properties: { role: { $ref: "#/components/schemas/Role" }, unchanged: { type: boolean } }
    RoleDetailResponse:
      type: object
      required: [role, permissions]
      properties: { role: { $ref: "#/components/schemas/Role" }, permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } } }
    RoleListResponse:
      type: object
      required: [roles, permissions, pagination]
      properties: { roles: { type: array, items: { $ref: "#/components/schemas/Role" } }, permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }, pagination: { $ref: "#/components/schemas/Pagination" } }
    Category:
      type: object
      required: [id, name, active, products_count, created_at, updated_at]
      properties: { id: { type: integer }, name: { type: string, maxLength: 120 }, description: { type: [string, "null"], maxLength: 500 }, active: { type: boolean }, products_count: { type: integer, minimum: 0 }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } }
    CategoryWriteRequest: { type: object, required: [name], properties: { name: { type: string, maxLength: 120 }, description: { type: [string, "null"], maxLength: 500 }, active: { type: boolean } } }
    CategoryResponse: { type: object, required: [category], properties: { category: { $ref: "#/components/schemas/Category" }, unchanged: { type: boolean } } }
    CategoryListResponse: { type: object, required: [categories, pagination], properties: { categories: { type: array, items: { $ref: "#/components/schemas/Category" } }, pagination: { $ref: "#/components/schemas/Pagination" } } }
    CategoryOption: { type: object, required: [id, name, active], properties: { id: { type: integer }, name: { type: string }, active: { type: boolean } } }
    Product:
      type: object
      required: [id, category_id, category_name, name, sku, cost_price, selling_price, minimum_stock, unit, active, created_at, updated_at]
      properties: { id: { type: integer }, category_id: { type: integer }, category_name: { type: string }, name: { type: string, maxLength: 160 }, sku: { type: string, maxLength: 64 }, barcode: { type: [string, "null"], maxLength: 64 }, cost_price: { type: integer, minimum: 0 }, selling_price: { type: integer, minimum: 0 }, minimum_stock: { type: integer, minimum: 0 }, unit: { type: string, maxLength: 30 }, active: { type: boolean }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } }
    ProductWriteRequest: { type: object, required: [category_id, name, sku, cost_price, selling_price, minimum_stock, unit], properties: { category_id: { type: integer }, name: { type: string, maxLength: 160 }, sku: { type: string, maxLength: 64 }, barcode: { type: [string, "null"], maxLength: 64 }, cost_price: { type: integer, minimum: 0 }, selling_price: { type: integer, minimum: 0 }, minimum_stock: { type: integer, minimum: 0 }, unit: { type: string, maxLength: 30 }, active: { type: boolean } } }
    ProductResponse: { type: object, required: [product], properties: { product: { $ref: "#/components/schemas/Product" }, unchanged: { type: boolean } } }
    ProductDetailResponse: { type: object, required: [product, categories], properties: { product: { $ref: "#/components/schemas/Product" }, categories: { type: array, items: { $ref: "#/components/schemas/CategoryOption" } } } }
    ProductListResponse: { type: object, required: [products, categories, pagination], properties: { products: { type: array, items: { $ref: "#/components/schemas/Product" } }, categories: { type: array, items: { $ref: "#/components/schemas/CategoryOption" } }, pagination: { $ref: "#/components/schemas/Pagination" } } }
    InventoryItem: { type: object, required: [id, name, sku, current_stock, minimum_stock, unit], properties: { id: { type: integer }, name: { type: string }, sku: { type: string }, barcode: { type: [string, "null"] }, category_name: { type: string }, current_stock: { type: integer, minimum: 0 }, minimum_stock: { type: integer, minimum: 0 }, unit: { type: string }, active: { type: boolean }, stock_status: { type: string, enum: [available, low, out] } } }
    InventoryListResponse: { type: object, required: [inventory, pagination], properties: { inventory: { type: array, items: { $ref: "#/components/schemas/InventoryItem" } }, pagination: { $ref: "#/components/schemas/Pagination" } } }
    StockMovement: { type: object, required: [id, product_id, product_name, movement_type, quantity, stock_before, stock_after, note, user_email, created_at], properties: { id: { type: integer }, product_id: { type: integer }, product_name: { type: string }, movement_type: { type: string }, quantity: { type: integer }, stock_before: { type: integer }, stock_after: { type: integer }, note: { type: string }, user_email: { type: string }, created_at: { type: string, format: date-time } } }
    StockMovementListResponse: { type: object, required: [stock_movements, pagination], properties: { stock_movements: { type: array, items: { $ref: "#/components/schemas/StockMovement" } }, pagination: { $ref: "#/components/schemas/Pagination" } } }
    CashierShift: { type: object, required: [id, shift_number, status, opened_at, opening_cash, user_email, transaction_count, cash_sales, non_cash_sales, refunds], properties: { id: { type: integer }, shift_number: { type: string }, status: { type: string, enum: [open, closed] }, opened_at: { type: string, format: date-time }, closed_at: { type: [string, "null"], format: date-time }, opening_cash: { type: integer }, expected_cash: { type: [integer, "null"] }, actual_cash: { type: [integer, "null"] }, cash_difference: { type: [integer, "null"] }, opening_note: { type: [string, "null"] }, closing_note: { type: [string, "null"] }, user_email: { type: string }, transaction_count: { type: integer }, cash_sales: { type: integer }, non_cash_sales: { type: integer }, refunds: { type: integer } } }
    CashierShiftResponse: { type: object, required: [cashier_shift], properties: { cashier_shift: { anyOf: [{ $ref: "#/components/schemas/CashierShift" }, { type: "null" }] } } }
    CashierShiftListResponse: { type: object, required: [cashier_shifts, pagination], properties: { cashier_shifts: { type: array, items: { $ref: "#/components/schemas/CashierShift" } }, pagination: { $ref: "#/components/schemas/Pagination" } } }
    Sale: { type: object, required: [id, sale_number, status, subtotal, discount, total, completed_at, user_email, item_count], properties: { id: { type: integer }, sale_number: { type: string }, status: { type: string }, subtotal: { type: integer }, discount: { type: integer }, total: { type: integer }, completed_at: { type: string, format: date-time }, user_email: { type: string }, item_count: { type: integer }, payment_method: { type: [string, "null"] }, received_amount: { type: [integer, "null"] }, change_amount: { type: [integer, "null"] } } }
    SaleResponse: { type: object, required: [sale], properties: { sale: { $ref: "#/components/schemas/Sale" } } }
    SaleListResponse: { type: object, required: [sales, pagination], properties: { sales: { type: array, items: { $ref: "#/components/schemas/Sale" } }, pagination: { $ref: "#/components/schemas/Pagination" } } }
    SaleRefundRequest: { type: object, required: [refund_type, reason], properties: { refund_type: { type: string, enum: [partial, void] }, reason: { type: string, maxLength: 500 }, items: { type: array, items: { type: object, required: [sale_item_id, quantity], properties: { sale_item_id: { type: integer }, quantity: { type: integer, minimum: 1 } } } } } }
    SaleRefund: { type: object, required: [id, refund_number, refund_type, status, total, reason, requested_by, items], properties: { id: { type: integer }, refund_number: { type: string }, refund_type: { type: string, enum: [partial, void] }, status: { type: string, enum: [pending, approved, rejected] }, total: { type: integer }, reason: { type: string }, review_note: { type: [string, "null"] }, requested_by: { type: string, format: email }, reviewed_by: { type: [string, "null"], format: email }, reviewed_at: { type: [string, "null"], format: date-time }, items: { type: array, items: { type: object } } } }
    SaleRefundResponse: { type: object, required: [refund], properties: { refund: { $ref: "#/components/schemas/SaleRefund" } } }
    AdminApproval:
